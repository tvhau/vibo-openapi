openapi: 3.0.0

info:
  title: "Advanced Image Search Documentation"
  description: "Simple and fast Image Search API. Search images in real-time with advanced filters (size, color, type, region, usage rights). Works similar to Google Advanced Image Search, Bing, Yahoo, and Yandex. Keywords: image search, search images, images search API, advanced image search, photo search, find pictures online."
  version: 1.0.0

servers:
  - url: http://localhost:8080/advanced-image-search

paths:

  /languages:
    get:
      summary: "Get languages"
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            example: "Afrikaans"
          description: |
            Optional language name.
            Example: `Afrikaans`
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object

  /regions:
    get:
      summary: "Get regions"
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            example: "Argentina"
          description: |
            Optional region name.
            Example: `Argentina`
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object

  /images/search:
    get:
      summary: "Search images"

      parameters:

        - name: regionId
          in: query
          required: true
          schema:
            type: string
            example: "mountain"
          description: "Search keyword or region identifier."

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
          description: "Maximum number of images to return."

        - name: size
          in: query
          required: false
          schema:
            type: string
            enum:
              - Small
              - Medium
              - Large
              - Wallpaper
          description: |
            Select one of the following values:
            - Default: No minimum size
            - `Small`
            - `Medium`
            - `Large`
            - `Wallpaper`

        - name: color
          in: query
          required: false
          schema:
            type: string
            enum:
              - color
              - Monochrome
              - Red
              - Orange
              - Yellow
              - Green
              - Blue
              - Purple
              - Pink
              - Brown
              - Black
              - Gray
              - Teal
              - White
          description: |
            Select one of the following values:
            - `color`: Color only
            - `Monochrome`: Black and white
            - `Red`
            - `Orange`
            - `Yellow`
            - `Green`
            - `Blue`
            - `Purple`
            - `Pink`
            - `Brown`
            - `Black`
            - `Gray`
            - `Teal`
            - `White`

        - name: time
          in: query
          required: false
          schema:
            type: string
            enum:
              - Day
              - Week
              - Month
          description: |
            Select one of the following values:
            - `Day`: Past day
            - `Week`: Past week
            - `Month`: Past month

        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - photo
              - clipart
              - gif
              - transparent
              - line
          description: |
            Select one of the following values:
            - `photo`: Photograph
            - `clipart`
            - `gif`: Animated GIF
            - `transparent`
            - `line`: Line drawing

        - name: layout
          in: query
          required: false
          schema:
            type: string
            enum:
              - Square
              - Tall
              - Wide
          description: |
            Select one of the following values:
            - `Square`
            - `Tall`
            - `Wide`

        - name: licenses
          in: query
          required: false
          schema:
            type: string
            enum:
              - Any
              - Public
              - Share
              - ShareCommercially
              - Modify
              - ModifyCommercially
          description: |
            Select one of the following values:
            - `Any`: All creative commons
            - `Public`: Public domain
            - `Share`: Free to share and use
            - `ShareCommercially`: Free to share and use commercially
            - `Modify`: Free to modify, share and use
            - `ModifyCommercially`: Free to modify, share and use commercially

        - name: safeSearch
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 1
              - -1
            default: 1
          description: |
            Safe search mode:
            - `1`: Enabled
            - `-1`: Disabled

        - name: region
          in: query
          required: false
          schema:
            type: string
            default: "us-en"
            example: "us-en"
          description: |
            Region code retrieved from the `/regions` endpoint using `data.code`.

      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    X-API-Key:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key

security:
  - X-API-Key: []