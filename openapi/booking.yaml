openapi: 3.0.0

info:
  title: "Booking API Documentation"
  version: "1.0.0"
  description: |
    Real-time Booking.com data – Unofficial API for listings worldwide.
    Get real-time data from Booking.com, a leading and widely used online
    platform for booking hotels, vacation rentals, apartments, and other
    accommodations.
    This unofficial API provides access to Booking listings, prices,
    availability, and more — helping you find a great place to stay at
    an amazing price.
    All data is collected from publicly available content.

servers:
  - url: http://localhost:8080/booking

paths:

  /booking/currency:
    get:
      summary: "currencies"
      tags:
        - General
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            example: "USD"
          description: |
            Optional currencies name or code.
            Example: `USD`

      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object

  /booking/languages:
    get:
      summary: "languages"
      tags:
        - General
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            example: "United States"
          description: |
            Optional languages name.
            Example: `United States`

      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object

  /booking-app/flights/auto-complete:
    get:
      summary: "flights/auto-complete"
      tags:
        - Flights

      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            example: "new"
          description: |
            Search for an airport, city, or other flight location.

            - Required: true
            - Example: `new`

      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object

  /booking-app/flights/search-roundtrip:
    get:
      summary: "flights/search-roundtrip"
      tags:
        - Flights
      parameters:
        - name: leavingFrom
          in: query
          required: true
          schema:
            type: string
            example: "JFK"
          description: |
            Departure airport code.

            - Required: true
            - The value of  **leavingFrom** can be retrieved from the ` /flights/auto-complete` endpoint (field data.code) where type is AIRPORT.
            - Example: `JFK`

        - name: goingTo
          in: query
          required: true
          schema:
            type: string
            example: "LOS"
          description: |
            Destination airport code.

            - Required: true
            - The value can be retrieved from the `/flights/auto-complete`
              endpoint using the `data.code` field where `type` is `AIRPORT`.
            - Example: `LOS`

        - name: departureDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: |
            Departure date.
            - Format: `YYYY-MM-DD`
            - If not provided, the API uses the current date plus one day.
            - Example: `2024-05-25`
        - name: returnDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: |
            Departure date.
            - Format: `YYYY-MM-DD`
            - Default is departureDate plus five days
            - Example: `2024-10-25`
        - name: page
          in: query
          schema:
            type: number
            example: 2
            default: 1
          description: |
            - The page index, for paging purpose
             - Ex: `2`
             - Default: `1`
        - name: cabinClass
          in: query
          required: false
          schema:
            type: string
          description: |
            Default: `ECONOMY`
            Select one of the values below:
              - `ECONOMY`: Economy
              - `PREMIUM_ECONOMY`: Premium economy
              - `BUSINESS`: Business
              - `FIRST`: First
        - name: children
          in: query
          required: false
          schema:
            type: string
          description: |
            Age range: 2-17 years old  
            Multiple integer values can be entered, separated by commas.
            Example: 2, 6
        - name: stops
          in: query
          required: false
          schema:
            type: string
          description: |
            Select one of the values below:  
            - `1`: Max 1 stop per flight
            - `2`: Max 2 stops per flight
            - `3`: Max 3 stops per flight
            - `4`: Max 4 stops per flight
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: |
            Default: `BEST`
            Select one of the values below:
              - `BEST`: Best
              - `CHEAPEST`: Cheapest
              - `FASTEST`: Fastest
        - name: languageCode
          in: query
          required: false
          schema:
            type: string
          description: |
            The value of  **languageCode**  can be retrieved from `/languages` endpoint(data->code)
        - name: airlines
          in: query
          required: false
          schema:
            type: string
          description: |
            The value of  `airlines`   can be retrieved from this endpoint(**data->aggregation->airlines->iataCode**)
              
            You can enter multiple values, separated by commas (`,`)
            - `ET`: Ethiopian Airlines
            - `HF`: Air Cote D'Ivoire
            - `MS`: Egyptair
            - `AT`: Royal Air Maroc
                 ....
        - name: duration
          in: query
          required: false
          schema:
            type: number
          description: |
            ""
        - name: directFlightsOnly
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Default: `false`
        - name: departingFlightDepartureTime
          in: query
          required: false
          schema:
            type: string
          description: |
            You can enter multiple values, separated by commas (`,`)
            Example: `00:00-05:59,06:00-11:59`
        - name: departingFlightArrivalTime
          in: query
          required: false
          schema:
            type: string
          description: |
            You can enter multiple values, separated by commas (`,`)
            Example: `00:00-05:59,18:00-23:59`
        - name: returnFlightDepartureTime
          in: query
          required: false
          schema:
            type: string
          description: |
            You can enter multiple values, separated by commas (`,`)
            Example: `00:00-05:59,06:00-11:59`
        - name: returnFlightArrivalTime
          in: query
          required: false
          schema:
            type: string
          description: |
            You can enter multiple values, separated by commas (`,`)
            Example: `00:00-05:59,18:00-23:59`

      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object

  /booking-app/flights/search-minprice-roundtrip:
    get:
      summary: "flights/search-minprice-roundtrip"
      tags:
        - Flights

      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            example: "new"
          description: |
            Search for a hotel, city, region, or accommodation.

            - Required: true
            - Example: `new`

      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:

    X-API-Key:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key

security:
  - X-API-Key: []

tags:
  - name: General
  - description: General endpoints
  - name: Flights
    description: Flight-related endpoints
  - name: Stays
    description: Accommodation-related endpoints
